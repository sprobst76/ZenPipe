name: Feature request
description: Suggest an idea for ZenPipe
labels: [feature request]
body:
  - type: markdown
    attributes:
      value: |
        ZenPipe is about watching deliberately instead of endless scrolling. Ideas that make the
        app calmer are very welcome; requests that loosen the limits (more feed, autoplay,
        Shorts) will usually be declined.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I searched the [existing issues](https://github.com/sprobst76/ZenPipe/issues?q=is%3Aissue) and found none for this idea."
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
    validations:
      required: true

  - type: textarea
    id: why-is-the-feature-requested
    attributes:
      label: Why do you want this feature?
    validations:
      required: true
