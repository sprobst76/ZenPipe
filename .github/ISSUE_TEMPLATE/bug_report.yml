name: Bug report
description: Report a bug in ZenPipe
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in ZenPipe.

        ZenPipe is a fork of NewPipe with deliberate limits (finite feed, no Shorts, no autoplay,
        intent prompt, mandatory pause, no downloads). These limits are features, not bugs.
        Please do not report ZenPipe issues to TeamNewPipe.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I use the latest version from [the releases page](https://github.com/sprobst76/ZenPipe/releases/latest)."
          required: true
        - label: "I searched the [existing issues](https://github.com/sprobst76/ZenPipe/issues?q=is%3Aissue) and found none for this bug."
          required: true
        - label: "This issue contains only one bug."
          required: true

  - type: input
    id: app-version
    attributes:
      label: Affected version
      description: "ZenPipe version (Settings > About)"
      placeholder: "0.1.0-zen.1"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Press on '....'
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If the app showed the error report screen, tap "Copy formatted report" and paste it here.

  - type: input
    id: device-info
    attributes:
      label: Device and Android version
      placeholder: "Example: Motorola Defy, Android 11"
