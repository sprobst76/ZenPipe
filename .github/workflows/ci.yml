name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - zen
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'zen-docs/**'
      - 'fastlane/**'
      - 'fdroid/**'
      - '.github/workflows/fdroid-repo.yml'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - zen
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'zen-docs/**'
      - 'fastlane/**'
      - 'fdroid/**'
      - '.github/workflows/fdroid-repo.yml'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-latest
    # ZenPipe: a hung packaging step once ran for hours; fail instead
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: create and checkout branch
        # push events already checked out the branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK and run jvm tests
        # ZenPipe: 4 GB Gradle heap (ONNX Runtime native libs made packageContinuous hang with the 2 GB default)
        run: ./gradlew assembleContinuous lintContinuous testDebugUnitTest --stacktrace -DskipFormatKtlint "-Dorg.gradle.jvmargs=-Xmx4g --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ZenPipe-continuous
          path: app/build/outputs/apk/continuous/*.apk

  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # ZenPipe: x86_64 (debug APKs ship arm64-v8a + x86_64 native code only)
          - api-level: 23
            target: default
            arch: x86_64
          - api-level: 35
            target: default
            arch: x86_64

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Run android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          script: ./gradlew connectedCheck --stacktrace

      - name: Upload test report when tests fail # because the printed out stacktrace (console) is too short, see also #7553
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/**
