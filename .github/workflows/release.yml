name: Release

# Builds, signs and publishes a ZenPipe release for a tag v<versionName> (e.g. v0.1.0-zen.1).
# Secrets (environment "release"):
#   ZENPIPE_KEYSTORE_BASE64    base64 of the PKCS12 keystore
#   ZENPIPE_KEYSTORE_PASSWORD  keystore password
#   ZENPIPE_KEY_ALIAS          key alias (e.g. zenpipe)
#   ZENPIPE_KEY_PASSWORD       key password
# Without these secrets the workflow fails; it never publishes an unsigned APK.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZENPIPE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ZENPIPE_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zenpipe.p12"
          echo "ZENPIPE_KEYSTORE=$RUNNER_TEMP/zenpipe.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ZENPIPE_KEYSTORE_PASSWORD: ${{ secrets.ZENPIPE_KEYSTORE_PASSWORD }}
          ZENPIPE_KEY_ALIAS: ${{ secrets.ZENPIPE_KEY_ALIAS }}
          ZENPIPE_KEY_PASSWORD: ${{ secrets.ZENPIPE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zenpipe.p12"

      - name: Check version, rename APK, checksum
        id: apk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          VERSION_NAME="$(jq -r '.elements[0].versionName' "$META")"
          VERSION_CODE="$(jq -r '.elements[0].versionCode' "$META")"
          if [ "$TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME"
            exit 1
          fi
          if find app/build/outputs/apk/release -name '*unsigned*.apk' | grep -q .; then
            echo "::error::APK is unsigned"
            exit 1
          fi
          # assume there is only one APK in that folder
          APK="app/build/outputs/apk/release/ZenPipe_v$VERSION_NAME.apk"
          mv app/build/outputs/apk/release/*.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          APK: ${{ steps.apk.outputs.apk }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::$CHANGELOG is missing"
            exit 1
          fi
          {
            cat "$CHANGELOG"
            echo
            echo "---"
            echo "ZenPipe is a fork of NewPipe (GPLv3), not affiliated with TeamNewPipe."
            echo
            echo "Source code of this release (GPLv3 section 6): $REPO_URL/tree/$TAG"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
            echo
            echo "Signing certificate:"
            echo '```'
            grep -E 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" || true
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "ZenPipe $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
